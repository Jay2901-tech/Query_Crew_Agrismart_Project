[project]
name = "agrismart-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=1.3.1,<1.4.0",
    "bing-image-downloader>=1.1.3",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.110.0",
    "folium>=1.0.0rc1",
    "matplotlib>=3.8.3,<3.9.0",
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.2.1,<3.0.0",
    "pillow>=10.2.0,<11.0.0",
    "plotly>=7.0.0",
    "pydantic>=2.6.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.4.1.post1",
    "scipy>=1.12.0",
    "seaborn>=0.13.2",
    "streamlit>=1.63.0",
    "streamlit-folium>=0.27.4",
    "timm>=0.9.12",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "tqdm>=4.66.2",
    "uvicorn>=0.28.0",
    "wandb>=0.30.0",
]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'win32'"]
index = [
  { name = "pytorch", url = "https://download.pytorch.org/whl/nightly/cu132", explicit = true }
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[dependency-groups]
dev = [
    "pymupdf>=1.28.2",
]
